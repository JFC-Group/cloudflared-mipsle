name: Build cloudflared for JF MIPSel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:  
  build-cloudflared:
    runs-on: ubuntu-latest
    name: Cross-compile cloudflared for mipsel

    steps:
    - name: Checkout cloudflared repo
      uses: actions/checkout@v4
      with:
        repository: cloudflare/cloudflared
        path: cloudflared
        fetch-depth: 0

    # Pure Go and statically linked, so no C toolchain is needed: the binary
    # never links against the router's uClibc.
    - name: Set environment variables
      run: |
        {
          echo "GOARCH=mipsle"
          echo "GOOS=linux"
          echo "CGO_ENABLED=0"
        } >> "$GITHUB_ENV"

    - name: Build cloudflared
      working-directory: cloudflared
      run: |
        go build -trimpath -ldflags="-w -s" -o cloudflared ./cmd/cloudflared

    - name: Release name
      id: release_name
      working-directory: cloudflared
      run: |
        echo "release_name=$(git describe --tags)" >> "$GITHUB_OUTPUT"

    - name: Generate tag name
      id: tag
      run: |
        TAG_NAME="release-$(date +%Y%m%d-%H%M%S)"
        echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

    - name: Create Release and Upload Binaries
      uses: softprops/action-gh-release@v2
      with:
        files: |
          cloudflared/cloudflared
        name: ${{ steps.release_name.outputs.release_name }}
        tag_name: ${{ steps.tag.outputs.tag_name }}
        make_latest: true
        draft: false
        prerelease: ${{ github.ref_name != 'main' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
